[project]
name = "mknight"
version = "0.1.0"
description = "Local Ubuntu 24.04 host hardening toolkit"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
mknight = "app.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
